name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/test-lifecycle-cli.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # compose-lifecycle builds the production bundle from this checkout.

  editor-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Match @playwright/test in package-lock.json. This AMD64 image includes
    # the browsers and their system libraries.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:cf0daee9b994042e011bc29f20cdff1a9f682a039b43fcd738f7d8a9d3bcd9d6
      options: --user 1001 --shm-size=1g
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:editor-e2e -- --grep-invert 'release-candidate\.spec\.ts' --shard=${{ matrix.shard }}/4
      # Run the signed-in scenarios once with a fresh server and login quota.
      - if: matrix.shard == 3
        run: npm run test:release-browser -- --project=chromium

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: node scripts/check-browser-vertical-no-first-party-mocks.mjs
      - run: npm ci
      - run: npm run test:agent-connect-http
      - run: npm run test:mcp-oauth-http

  compose-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Validate lifecycle scripts
        run: |
          shellcheck scripts/*.sh scripts/test-fixtures/*.sh
          bash -n scripts/*.sh scripts/test-fixtures/*.sh
          bash scripts/test-lifecycle-shell.sh
          bash scripts/test-update-image-revision.sh
      - name: Build and install
        run: ./scripts/install.sh
      - name: Create documents, draft history and uploaded media
        run: |
          umask 077
          curl --fail-with-body --silent --output /dev/null \
            -H 'Content-Type: application/json' -H 'Origin: http://localhost:3191' \
            --data '{"name":"Lifecycle test","email":"lifecycle@example.test","password":"disposable-compose-test-password"}' \
            http://localhost:3191/api/auth/sign-up/email
          docker compose --env-file .env.production exec -T --user node \
            -e NYXDOC_TEST_BASE_URL=http://gateway:3002 app ./node_modules/.bin/tsx \
            scripts/test-fixtures/release-qualification-historical.ts create lifecycle@example.test \
            >"$RUNNER_TEMP/nyxdoc-fixture.json"
      - name: Stop without deleting data
        run: ./scripts/uninstall.sh
      - name: Reinstall preserved data
        run: ./scripts/install.sh
      - name: Verify preserved documents, draft history and media bytes
        run: |
          docker compose --env-file .env.production exec -T --user node \
            -e NYXDOC_TEST_BASE_URL=http://gateway:3002 app ./node_modules/.bin/tsx \
            scripts/test-fixtures/release-qualification-historical.ts verify reinstall \
            <"$RUNNER_TEMP/nyxdoc-fixture.json"
      - name: Permanently remove the test installation
        run: ./scripts/uninstall.sh --purge --confirm-purge=nyxdoc
      - name: Clean up after failure
        if: always()
        run: |
          if [ -f .env.production ]; then
            docker compose --env-file .env.production -f compose.yaml down --volumes --remove-orphans || true
          fi
