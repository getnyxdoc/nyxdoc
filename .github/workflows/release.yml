name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/check-browser-vertical-no-first-party-mocks.mjs
      - run: node scripts/test-release-qualification-scripts.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:agent-connect-http
      - run: npm run test:mcp-oauth-http
      - run: npm run build

  build-candidate:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image: ${{ steps.candidate.outputs.image }}
      digest: ${{ steps.candidate.outputs.digest }}
      candidate_tag: ${{ steps.candidate.outputs.tag }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/getnyxdoc/nyxdoc:candidate-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.title=Nyxdoc
            org.opencontainers.image.description=An agent-native document system for people and their external agents.
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - id: candidate
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -Eeuo pipefail
          case "$DIGEST" in sha256:*) ;; *) exit 1;; esac
          tag="ghcr.io/getnyxdoc/nyxdoc:candidate-${RUN_ID}-${RUN_ATTEMPT}"
          image="ghcr.io/getnyxdoc/nyxdoc@${DIGEST}"
          observed=""
          for attempt in $(seq 1 12); do
            if inspection="$(docker buildx imagetools inspect "$tag" 2>&1)"; then
              observed="$(printf '%s\n' "$inspection" | awk '$1 == "Digest:" { print $2; exit }')"
              [ "$observed" = "$DIGEST" ] && break
            fi
            printf 'candidate digest not visible yet (attempt %s/12)\n' "$attempt" >&2
            sleep 10
          done
          test "$observed" = "$DIGEST"
          {
            echo "image=$image"
            echo "digest=$DIGEST"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

  qualify-candidate:
    needs: build-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: baseline
        env:
          CURRENT_TAG: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail
          baseline=""
          for candidate in $(git tag --list 'v[0-9]*' --sort=-v:refname | grep -Fxv "$CURRENT_TAG"); do
            version="${candidate#v}"
            if docker buildx imagetools inspect "ghcr.io/getnyxdoc/nyxdoc:${version}" >/dev/null 2>&1; then
              baseline="$candidate"
              break
            fi
          done
          test -n "$baseline"
          version="${baseline#v}"
          {
            echo "ref=$baseline"
            echo "image=ghcr.io/getnyxdoc/nyxdoc:${version}"
          } >> "$GITHUB_OUTPUT"
      - name: Qualify the immutable candidate image
        env:
          CANDIDATE_IMAGE: ${{ needs.build-candidate.outputs.image }}
          CANDIDATE_REVISION: ${{ github.sha }}
          BASELINE_REF: ${{ steps.baseline.outputs.ref }}
          BASELINE_IMAGE: ${{ steps.baseline.outputs.image }}
        run: |
          bash scripts/release-qualification.sh \
            --candidate-image "$CANDIDATE_IMAGE" \
            --candidate-revision "$CANDIDATE_REVISION" \
            --baseline-ref "$BASELINE_REF" \
            --baseline-image "$BASELINE_IMAGE" \
            --receipt release-qualification/receipt.json
      - name: Upload release qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-qualification/
          if-no-files-found: error
          retention-days: 90

  promote-image:
    needs: [build-candidate, qualify-candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ needs.build-candidate.outputs.image }}
      digest: ${{ needs.build-candidate.outputs.digest }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-qualification
      - name: Require complete digest-bound qualification evidence
        env:
          CANDIDATE_IMAGE: ${{ needs.build-candidate.outputs.image }}
          CANDIDATE_REVISION: ${{ github.sha }}
        run: >-
          node scripts/verify-release-qualification-receipt.mjs
          --receipt release-qualification/receipt.json
          --candidate-image "$CANDIDATE_IMAGE"
          --candidate-revision "$CANDIDATE_REVISION"
      - id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/getnyxdoc/nyxdoc
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Promote only the qualified manifest digest
        env:
          CANDIDATE_IMAGE: ${{ needs.build-candidate.outputs.image }}
          CANDIDATE_DIGEST: ${{ needs.build-candidate.outputs.digest }}
          TARGET_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          set -Eeuo pipefail
          for tag in $TARGET_TAGS; do
            docker buildx imagetools create --prefer-index=false -t "$tag" "$CANDIDATE_IMAGE"
            observed=""
            for attempt in $(seq 1 12); do
              if inspection="$(docker buildx imagetools inspect "$tag" 2>&1)"; then
                observed="$(printf '%s\n' "$inspection" | awk '$1 == "Digest:" { print $2; exit }')"
                [ "$observed" = "$CANDIDATE_DIGEST" ] && break
              fi
              printf 'promoted digest not visible yet for %s (attempt %s/12)\n' "$tag" "$attempt" >&2
              sleep 10
            done
            test "$observed" = "$CANDIDATE_DIGEST"
          done

  github-release:
    needs: promote-image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ needs.promote-image.outputs.image }}
        run: >-
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
          gh release create "$GITHUB_REF_NAME"
          --verify-tag
          --generate-notes
          --title "Nyxdoc $GITHUB_REF_NAME"
          --notes "Qualified immutable container: $IMAGE"
