services:
  app:
    image: ${NYXDOC_IMAGE:-nyxdoc-app:latest}
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NYXDOC_DB_PATH: /data/nyxdoc.db
      NYXDOC_MEDIA_ROOT: /data/media
      NYXDOC_BACKUP_ROOT: /backups
      NYXDOC_COLLABORATION_INTERNAL_URL: http://collaboration:3101
    expose:
      - "3000"
    volumes:
      - nyxdoc_data:/data
      - ${NYXDOC_BACKUP_HOST_PATH:-./data/backups}:/backups
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    stop_grace_period: 20s

  collaboration:
    image: ${NYXDOC_IMAGE:-nyxdoc-app:latest}
    init: true
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    command:
      - npm
      - run
      - start:collaboration
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      NYXDOC_DB_PATH: /data/nyxdoc.db
      NYXDOC_MEDIA_ROOT: /data/media
      NYXDOC_BACKUP_ROOT: /backups
      NYXDOC_COLLABORATION_PORT: "3101"
      NYXDOC_COLLABORATION_INTERNAL_URL: http://collaboration:3101
    ports:
      - "${NYXDOC_HTTP_HOST:-127.0.0.1}:${NYXDOC_COLLABORATION_HOST_PORT:-3192}:3101"
    volumes:
      - nyxdoc_data:/data
      - ${NYXDOC_BACKUP_HOST_PATH:-./data/backups}:/backups
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3101/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    stop_grace_period: 20s

  gateway:
    image: ${NYXDOC_IMAGE:-nyxdoc-app:latest}
    init: true
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
      collaboration:
        condition: service_healthy
    command:
      - npm
      - run
      - start:gateway
    environment:
      NODE_ENV: production
      NYXDOC_GATEWAY_PORT: "3002"
      NYXDOC_GATEWAY_APP_URL: http://app:3000
      NYXDOC_GATEWAY_COLLABORATION_URL: http://collaboration:3101
    ports:
      - "${NYXDOC_HTTP_HOST:-127.0.0.1}:${NYXDOC_HTTP_PORT:-3191}:3002"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3002/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    stop_grace_period: 20s

volumes:
  nyxdoc_data:
    name: ${NYXDOC_DATA_VOLUME:-nyxdoc_data}
